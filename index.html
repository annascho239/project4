<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Virtual Hallo"weenie"</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* Center the phone-portrait container on wide screens */
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ── Layers ─────────────────────────────────────────── */

    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Ambient effects (fog, bats, lights) — no pointer events */
    #ambient-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Tap hotspots */
    #hotspot-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
    }

    /* Story animations */
    #story-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    /* HUD: pause button + hint text */
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
    }

    /* ── Pause button ──────────────────────────────────── */

    #pause-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 200, 100, 0.4);
      border-radius: 8px;
      color: #ffd580;
      font-size: 18px;
      cursor: pointer;
      pointer-events: all;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #pause-btn:hover { background: rgba(0, 0, 0, 0.8); }

    /* ── Hint text ─────────────────────────────────────── */

    #hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 220, 150, 0.85);
      font-size: 0.85rem;
      text-align: center;
      text-shadow: 0 1px 6px #000;
      letter-spacing: 0.03em;
      padding: 6px 14px;
      background: rgba(0,0,0,0.35);
      border-radius: 4px;
      max-width: 80%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s;
    }
    #hint.visible { opacity: 1; }

    /* ── Hotspot tap zones ─────────────────────────────── */
    /* Positions are approximate — adjust after viewing on screen */

    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 12px;
      /* Debug outline — remove when tuned: */
      /* outline: 2px dashed rgba(255,0,0,0.5); */
    }
    .hotspot:focus-visible {
      outline: 2px solid #ffd580;
      outline-offset: 3px;
    }

    /* Carousel — left foreground */
    #carousel-zone {
      left: 2%;
      bottom: 18%;
      width: 38%;
      height: 28%;
    }

    /* Clown booth — right side */
    #clown-zone {
      right: 2%;
      top: 35%;
      width: 34%;
      height: 26%;
    }

    /* Fortune teller booth — center mid-ground */
    #fortune-zone {
      left: 30%;
      top: 42%;
      width: 38%;
      height: 22%;
    }

    /* ── Start screen ──────────────────────────────────── */

    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #start-screen h1 {
      color: #ff7a00;
      font-size: 2.2rem;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 10px;
      text-shadow: 0 0 24px rgba(255, 122, 0, 0.7);
      letter-spacing: 0.02em;
    }

    #start-screen .tagline {
      color: #998877;
      font-size: 0.95rem;
      margin-bottom: 48px;
      letter-spacing: 0.08em;
    }

    #enter-btn {
      padding: 14px 44px;
      background: transparent;
      border: 2px solid #ff7a00;
      color: #ff7a00;
      font-family: Georgia, serif;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      min-width: 44px;
      min-height: 44px;
    }
    #enter-btn:hover,
    #enter-btn:focus-visible {
      background: rgba(255, 122, 0, 0.18);
      outline: none;
    }

    /* Reduced-motion: disable all transitions/animations */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Layer 0: Background -->
  <img id="bg" src="assets/halloweenbackground.png" alt="Abandoned carnival at night">

  <!-- Layer 1: Ambient effects -->
  <div id="ambient-layer">
    <!-- fog, bats, flickering lights added in JS -->
  </div>

  <!-- Layer 2: Interactive hotspots -->
  <div id="hotspot-layer">
    <div id="carousel-zone"  class="hotspot" role="button" tabindex="0" aria-label="Carousel"></div>
    <div id="clown-zone"     class="hotspot" role="button" tabindex="0" aria-label="Clown booth"></div>
    <div id="fortune-zone"   class="hotspot" role="button" tabindex="0" aria-label="Fortune teller booth"></div>
  </div>

  <!-- Layer 3: Story animations -->
  <div id="story-layer"></div>

  <!-- Layer 4: HUD -->
  <div id="ui-layer">
    <button id="pause-btn" aria-label="Pause">⏸</button>
    <div id="hint" role="status" aria-live="polite"></div>
  </div>

  <!-- Start screen -->
  <div id="start-screen">
    <h1>Virtual<br>Hallo"weenie"</h1>
    <p class="tagline">Enter if you dare…</p>
    <button id="enter-btn">Enter</button>
  </div>

</div>

<script>
  /* ── State ──────────────────────────────────────────── */

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = false;
  let storyPlaying = false;

  /* ── Start screen ───────────────────────────────────── */

  const startScreen = document.getElementById('start-screen');
  const enterBtn    = document.getElementById('enter-btn');

  function startScene() {
    startScreen.style.display = 'none';
    if (!prefersReducedMotion) startAmbient();
    scheduleHints();
    // TODO: start ambient audio (requires user gesture — already have it here)
  }

  enterBtn.addEventListener('click', startScene);
  enterBtn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') startScene();
  });

  /* ── Pause / resume ─────────────────────────────────── */

  const pauseBtn = document.getElementById('pause-btn');

  pauseBtn.addEventListener('click', togglePause);

  function togglePause() {
    paused = !paused;
    pauseBtn.textContent      = paused ? '▶' : '⏸';
    pauseBtn.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    // TODO: pause/resume ambient animations and audio
  }

  /* ── Ambient effects (stubs) ────────────────────────── */

  function startAmbient() {
    // TODO: fog layer, bat animations, light flicker
  }

  /* ── Hint system ────────────────────────────────────── */

  const hintEl = document.getElementById('hint');
  let hintTimer = null;

  const hints = [
    { delay: 15000, text: "Something lurks in the shadows…" },
    { delay: 35000, text: "The carousel looks like it hasn't moved in years." },
    { delay: 60000, text: "That clown's grin seems… off." },
    { delay: 90000, text: "What secrets does the fortune teller keep?" },
  ];

  function scheduleHints() {
    hints.forEach(({ delay, text }) => {
      setTimeout(() => showHint(text), delay);
    });
  }

  function showHint(text) {
    if (paused || storyPlaying) return;
    hintEl.textContent = text;
    hintEl.classList.add('visible');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hintEl.classList.remove('visible'), 5000);
  }

  /* ── Hotspot interactions (stubs) ───────────────────── */

  function onHotspotTap(id) {
    if (paused || storyPlaying) return;
    console.log('tapped:', id);
    // TODO: trigger progress for each story
  }

  document.querySelectorAll('.hotspot').forEach(el => {
    el.addEventListener('click',   () => onHotspotTap(el.id));
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') onHotspotTap(el.id);
    });
  });
</script>
</body>
</html>
