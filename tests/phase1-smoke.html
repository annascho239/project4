<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three-story browser smoke test</title>
  <style>
    body { margin: 0; background: #181818; color: #eee; font: 14px/1.5 system-ui, sans-serif; }
    main { display: flex; gap: 20px; align-items: flex-start; padding: 20px; }
    iframe { width: 375px; height: 667px; border: 2px solid #777; flex: 0 0 auto; }
    #results { white-space: pre-wrap; }
    .pass { color: #89e089; }
    .fail { color: #ff8a8a; }
  </style>
</head>
<body>
<main>
  <iframe id="app-frame" src="../index.html" title="App under test"></iframe>
  <section>
    <h1>Three-story smoke test</h1>
    <div id="results">Running…</div>
  </section>
</main>
<script>
  const frame = document.getElementById('app-frame');
  const results = document.getElementById('results');
  const checks = [];
  const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

  function check(condition, message) {
    checks.push({ condition: Boolean(condition), message });
  }

  frame.addEventListener('load', async () => {
    const doc = frame.contentDocument;
    const win = frame.contentWindow;

    check(doc.getElementById('start-screen'), 'Start screen exists');
    doc.getElementById('enter-btn').click();
    await wait(150);

    check(doc.getElementById('start-screen').style.display === 'none', 'Enter opens the scene');
    check(doc.querySelector('.intro-text')?.textContent.includes('one final show'), 'Opening establishes why the carnival is abandoned');
    check(doc.querySelectorAll('.fog').length === 2, 'Two fog layers start');
    check(doc.querySelectorAll('.light').length === 11, 'Flickering string lights start');
    check(doc.querySelectorAll('.bat').length >= 1, 'Bat ambience starts');
    check(doc.getElementById('ambient-audio').error === null, 'Ambient audio asset loads without an error');

    const carousel = doc.getElementById('carousel-zone');
    const clown = doc.getElementById('clown-zone');
    const tent = doc.getElementById('tent-zone');
    const testParams = new URLSearchParams(location.search);
    if (testParams.has('show-targets')) {
      carousel.style.background = 'rgba(100, 255, 130, .3)';
      clown.style.background = 'rgba(255, 80, 80, .3)';
      tent.style.background = 'rgba(120, 220, 80, .3)';
    }
    if (testParams.has('visual-opening')) {
      const visualDelay = Number(testParams.get('visual-opening')) || 1000;
      frame.style.width = `${Number(testParams.get('visual-width')) || 393}px`;
      frame.style.height = `${Number(testParams.get('visual-height')) || 852}px`;
      await wait(visualDelay);
      doc.getElementById('pause-btn').click();
      const introCaptions = doc.querySelectorAll('.intro-text');
      const intro = introCaptions[introCaptions.length - 1];
      const introAnimation = intro?.getAnimations()[0];
      if (introAnimation) {
        const elapsed = visualDelay + 150;
        introAnimation.currentTime = elapsed > 4400 ? elapsed - 4400 : elapsed;
      }
      results.textContent = intro
        ? `Opening frozen at ${visualDelay + 150}ms\nCaption: ${intro.textContent}\nOpacity: ${win.getComputedStyle(intro).opacity}`
        : `Opening frozen at ${visualDelay + 150}ms\nCaption not present`;
      results.dataset.status = 'visual';
      return;
    }
    if (testParams.has('visual-progress')) {
      const storyName = testParams.get('visual-progress');
      const storyTargets = { carousel, clown, tent };
      const target = storyTargets[storyName];
      const tapCount = Math.min(2, Math.max(1, Number(testParams.get('visual-taps')) || 1));
      frame.style.width = `${Number(testParams.get('visual-width')) || 393}px`;
      frame.style.height = `${Number(testParams.get('visual-height')) || 852}px`;
      await wait(50);
      for (let tap = 0; tap < tapCount; tap++) target.click();
      await wait(500);
      doc.getElementById('pause-btn').click();
      doc.getElementById('hint').getAnimations().forEach(animation => animation.currentTime = 500);
      results.textContent = `${storyName} progress after ${tapCount} tap${tapCount === 1 ? '' : 's'}\n${doc.getElementById('hint').textContent}`;
      results.dataset.status = 'visual';
      return;
    }
    if (testParams.has('visual-story')) {
      const storyName = testParams.get('visual-story');
      const storyTargets = { carousel, clown, tent };
      const target = storyTargets[storyName];
      const visualDelay = Number(testParams.get('visual-time')) || 3000;
      frame.style.width = `${Number(testParams.get('visual-width')) || 393}px`;
      frame.style.height = `${Number(testParams.get('visual-height')) || 852}px`;
      await wait(50);
      target.click();
      target.click();
      target.click();
      await wait(visualDelay);
      doc.getElementById('pause-btn').click();
      const titleAnimation = doc.querySelector('.story-title')?.getAnimations()[0];
      if (titleAnimation) titleAnimation.currentTime = visualDelay;
      const reveal = doc.querySelector('.story-reveal');
      const revealStarts = { carousel: 2500, clown: 2600, tent: 2800 };
      const revealAnimation = reveal?.getAnimations()[0];
      if (revealAnimation) revealAnimation.currentTime = Math.max(0, visualDelay - revealStarts[storyName]);
      results.textContent = reveal
        ? `${storyName} story frozen at ${visualDelay}ms\nCaption: ${reveal.textContent}\nOpacity: ${win.getComputedStyle(reveal).opacity}`
        : `${storyName} story frozen at ${visualDelay}ms\nCaption not present`;
      results.dataset.status = 'visual';
      return;
    }
    if (testParams.has('visual-clown')) {
      const visualDelay = Number(testParams.get('visual-clown')) || 2500;
      frame.style.width = `${Number(testParams.get('visual-width')) || 393}px`;
      frame.style.height = `${Number(testParams.get('visual-height')) || 852}px`;
      await wait(50);
      clown.click();
      clown.click();
      clown.click();
      await wait(visualDelay);
      const animationTimes = [
        ['.clown-eye-glow', visualDelay],
        ['.clown-hand', visualDelay - 2200],
      ];
      for (const [selector, storyTime] of animationTimes) {
        doc.querySelectorAll(selector).forEach(element => {
          const animation = element.getAnimations()[0];
          if (!animation) return;
          animation.pause();
          animation.currentTime = Math.max(0, storyTime);
        });
      }
      doc.getElementById('pause-btn').click();
      const hand = doc.querySelector('.clown-hand');
      const handRect = hand?.getBoundingClientRect();
      const handStyle = hand ? win.getComputedStyle(hand) : null;
      results.textContent = hand
        ? `Clown story frozen at ${visualDelay}ms\nHand: ${Math.round(handRect.width)}×${Math.round(handRect.height)} at ${Math.round(handRect.left)},${Math.round(handRect.top)}; opacity ${handStyle.opacity}; transform ${handStyle.transform}`
        : `Clown story frozen at ${visualDelay}ms\nHand not created yet`;
      results.dataset.status = 'visual';
      return;
    }
    check(doc.querySelectorAll('.hotspot').length === 3, 'All three story hotspots are active');
    for (const [width, height] of [[320, 568], [375, 667], [390, 844], [393, 852], [430, 932]]) {
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      await wait(30);
      check(
        doc.documentElement.scrollWidth <= win.innerWidth,
        `${width}×${height} layout has no horizontal overflow (${doc.documentElement.scrollWidth}px content / ${win.innerWidth}px viewport)`
      );
      const sceneRect = doc.getElementById('scene').getBoundingClientRect();
      const backgroundRect = doc.getElementById('bg').getBoundingClientRect();
      check(
        Math.abs((sceneRect.width / sceneRect.height) - (941 / 1672)) < 0.001,
        `${width}×${height}: scene preserves the background aspect ratio`
      );
      check(
        Math.abs(backgroundRect.left - sceneRect.left) < 0.5 && Math.abs(backgroundRect.width - sceneRect.width) < 0.5,
        `${width}×${height}: background and hotspot coordinates stay aligned`
      );
      for (const [target, name] of [[carousel, 'carousel'], [tent, 'tent'], [clown, 'clown']]) {
        const rect = target.getBoundingClientRect();
        check(rect.width >= 44 && rect.height >= 44, `${width}px: ${name} target is at least 44×44`);
        const x = Math.max(1, Math.min(win.innerWidth - 1, rect.left + rect.width / 2));
        const y = Math.max(1, Math.min(win.innerHeight - 1, rect.top + rect.height / 2));
        check(doc.elementFromPoint(x, y) === target, `${width}px: ${name} target is reachable at its visible center`);
      }
    }
    /* Keep the interaction sequence at a modern tall-phone size. */
    frame.style.width = '393px';
    frame.style.height = '852px';

    carousel.click();
    await wait(30);
    check(doc.getElementById('status').textContent.includes('1 of 3'), 'First carousel tap reports progress');
    check(doc.getElementById('hint').textContent.includes('1 of 3 awakened'), 'First carousel tap shows visible three-step progress');
    check(doc.getElementById('hint').textContent.includes('One horse wakes'), 'First tap wakes one horse');
    carousel.click();
    await wait(30);
    check(doc.getElementById('hint').textContent.includes('2 of 3 awakened'), 'Second carousel tap shows visible three-step progress');
    check(doc.getElementById('hint').textContent.includes('second horse'), 'Second tap wakes another horse');
    carousel.click();
    await wait(150);
    check(Boolean(doc.querySelector('.carousel-spin')), 'Three carousel taps start The Last Ride');
    check(doc.querySelector('.story-title-progress')?.textContent.includes('3 of 3'), 'Third carousel tap visibly completes the memory');
    check(doc.getElementById('hotspot-layer').inert, 'Story locks scene interaction');
    check(doc.getElementById('credits').inert, 'Story locks the secondary credits control');

    doc.getElementById('pause-btn').click();
    await wait(100);
    const spin = doc.querySelector('.carousel-spin');
    const beforePause = win.getComputedStyle(spin).transform;
    await wait(650);
    const afterPause = win.getComputedStyle(spin).transform;
    check(beforePause === afterPause, 'Pause freezes the active story animation');
    check(doc.getElementById('pause-btn').getAttribute('aria-label') === 'Resume', 'Pause control exposes its state');

    doc.getElementById('pause-btn').click();
    await wait(7200);
    check(!doc.querySelector('.carousel-spin'), 'Story ends after resume');
    check(!doc.getElementById('hotspot-layer').inert, 'Interaction unlocks after the story');
    check(!doc.getElementById('credits').inert, 'Credits unlock after the story');
    check(doc.getElementById('hint').textContent.includes('final horse slows'), 'Carousel ending explains what remains afterward');

    clown.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await wait(30);
    check(doc.getElementById('status').textContent.includes('1 of 3'), 'Clown trigger reports its own progress');
    check(doc.getElementById('hint').textContent.includes('1 of 3 awakened'), 'First clown tap shows visible three-step progress');
    check(doc.getElementById('hint').textContent.includes('painted eye notices'), 'First clown tap advances its story');
    clown.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await wait(30);
    check(doc.getElementById('hint').textContent.includes('2 of 3 awakened'), 'Second clown tap shows visible three-step progress');
    check(doc.getElementById('hint').textContent.includes('red nose warms'), 'Second clown tap advances its story');
    clown.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await wait(150);
    check(Boolean(doc.querySelector('.clown-eye-glow')), 'Keyboard input starts The Painted Grin');
    check(doc.querySelector('.story-title-progress')?.textContent.includes('3 of 3'), 'Third clown tap visibly completes the memory');
    check(doc.getElementById('hotspot-layer').inert, 'Clown story locks interaction');
    await wait(7100);
    check(!doc.querySelector('.clown-eye-glow'), 'Clown story ends and cleans up');
    check(!doc.getElementById('hotspot-layer').inert, 'Interaction returns after clown story');
    check(doc.getElementById('hint').textContent.includes('hand slips back'), 'Clown ending explains what remains afterward');

    tent.click();
    await wait(30);
    check(doc.getElementById('status').textContent.includes('1 of 3'), 'Tent trigger reports its own progress');
    check(doc.getElementById('hint').textContent.includes('1 of 3 awakened'), 'First tent tap shows visible three-step progress');
    check(doc.getElementById('hint').textContent.includes('green pulse'), 'First tent tap advances its story');
    tent.click();
    await wait(30);
    check(doc.getElementById('hint').textContent.includes('2 of 3 awakened'), 'Second tent tap shows visible three-step progress');
    check(doc.getElementById('hint').textContent.includes('shadow rises'), 'Second tent tap advances its story');
    tent.click();
    await wait(1400);
    check(Boolean(doc.querySelector('.tent-figure')), 'Three tent taps start The Last Show');
    check(doc.querySelector('.story-title-progress')?.textContent.includes('3 of 3'), 'Third tent tap visibly completes the memory');
    check(doc.getElementById('hotspot-layer').inert, 'Tent story locks interaction');
    await wait(6200);
    check(!doc.querySelector('.tent-figure'), 'Tent story ends and cleans up');
    check(!doc.getElementById('hotspot-layer').inert, 'Interaction returns after tent story');
    check(doc.getElementById('hint').textContent.includes('fall silent together'), 'Completing all stories reveals the connected ending');

    for (let tap = 0; tap < 3; tap++) {
      carousel.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    }
    await wait(150);
    check(Boolean(doc.querySelector('.carousel-spin')), 'A completed story can replay without reloading');

    const failures = checks.filter(item => !item.condition);
    results.className = failures.length ? 'fail' : 'pass';
    results.textContent = checks.map(item => `${item.condition ? 'PASS' : 'FAIL'} — ${item.message}`).join('\n');
    results.dataset.status = failures.length ? 'fail' : 'pass';
    document.title = failures.length ? 'FAIL — Three-story smoke test' : 'PASS — Three-story smoke test';
  });
</script>
</body>
</html>
